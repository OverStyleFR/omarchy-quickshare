<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Render from the repository root: rsvg-convert -o preview.png docs/assets/preview.svg -->
  <!-- quickshare-panel.png is the genuine idle Omarchy panel, not a simulated transfer. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151b1e"/><stop offset="0.55" stop-color="#0b1012"/><stop offset="1" stop-color="#102126"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#37868b" stop-opacity="0.23"/><stop offset="1" stop-color="#37868b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0.9" y2="1">
      <stop stop-color="#dce5e9"/><stop offset="1" stop-color="#8fe0fa"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#53666d"/><stop offset="0.35" stop-color="#26353b"/><stop offset="1" stop-color="#151b1e"/>
    </linearGradient>
    <linearGradient id="phone-screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172b32"/><stop offset="1" stop-color="#0d161a"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4fa3a6" stop-opacity="0.15"/><stop offset="0.5" stop-color="#8fe0fa"/><stop offset="1" stop-color="#4fa3a6" stop-opacity="0.4"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#8fe0fa" stroke-width="1" opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="panel-clip"><rect x="1320" y="224" width="489" height="679" rx="8"/></clipPath>
    <g id="share-mark" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 16 31 L 43 15 M 16 31 L 43 47"/>
      <circle cx="12" cy="31" r="6" fill="currentColor" stroke="none"/>
      <circle cx="47" cy="13" r="6" fill="currentColor" stroke="none"/>
      <circle cx="47" cy="49" r="6" fill="currentColor" stroke="none"/>
    </g>
    <g id="file-mark" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
      <path d="M 1 1 H 26 L 39 14 V 48 H 1 Z M 26 1 V 14 H 39"/>
      <path d="M 10 26 H 30 M 10 35 H 26" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <ellipse cx="1490" cy="495" rx="820" ry="690" fill="url(#halo)"/>
  <g fill="none" stroke="#4fa3a6" opacity="0.12">
    <ellipse cx="1540" cy="555" rx="510" ry="420"/>
    <ellipse cx="1540" cy="555" rx="650" ry="550"/>
    <ellipse cx="1540" cy="555" rx="805" ry="690"/>
  </g>
  <path d="M 0 0 H 1920" stroke="#4fa3a6" stroke-width="6"/>

  <g font-family="Noto Sans, sans-serif">
    <rect x="112" y="88" width="62" height="62" rx="17" fill="#21383f" stroke="#37868b"/>
    <use xlink:href="#share-mark" x="118" y="89" color="#8fe0fa"/>
    <text x="198" y="128" fill="#abb2bf" font-size="25" font-weight="600" letter-spacing="3">OMARCHY COMMUNITY PLUGIN</text>

    <text x="103" y="329" fill="url(#title)" font-size="145" font-weight="800" letter-spacing="-6">Quick Share</text>
    <text x="112" y="424" fill="#dce5e9" font-size="53" font-weight="600" letter-spacing="-1.6">Android meets Omarchy.</text>
    <text x="112" y="506" fill="#abb2bf" font-size="32">Share files with native Android Quick Share.</text>
    <text x="112" y="553" fill="#abb2bf" font-size="32">No companion Android app.</text>

    <g transform="translate(112 644)">
      <rect width="330" height="70" rx="35" fill="#1b2d33" stroke="#37868b"/>
      <g transform="translate(25 23)" fill="none" stroke="#8fe0fa" stroke-width="2.8" stroke-linecap="round">
        <path d="M 0 7 Q 13 -5 26 7 M 5 13 Q 13 5 21 13 M 10 20 Q 13 17 16 20"/>
        <circle cx="13" cy="25" r="1.8" fill="#8fe0fa" stroke="none"/>
      </g>
      <text x="70" y="45" fill="#dce5e9" font-size="27" font-weight="600">LAN + Bluetooth</text>
    </g>
    <g transform="translate(462 644)">
      <rect width="392" height="70" rx="35" fill="#151f24" stroke="#34484f"/>
      <text x="30" y="45" fill="#dce5e9" font-size="27" font-weight="600">Built into your desktop</text>
    </g>
    <text x="112" y="778" fill="#abb2bf" font-size="29">Single or multiple files</text>
    <circle cx="448" cy="768" r="3.5" fill="#4fa3a6"/>
    <text x="470" y="778" fill="#abb2bf" font-size="29">English / Español</text>
  </g>

  <!-- Device illustration. Its screen contains artwork only, not fictional UI. -->
  <path d="M 1140 565 C 1030 362 1145 330 1295 370 C 1450 407 1405 529 1280 609" fill="none" stroke="url(#route)" stroke-width="3" stroke-dasharray="8 12"/>
  <g transform="translate(1132 329) rotate(-12 62 70)" filter="url(#shadow)">
    <rect width="126" height="142" rx="24" fill="#1a2c33" stroke="#4fa3a6" stroke-opacity="0.7"/>
    <use xlink:href="#file-mark" transform="translate(44 44)" color="#8fe0fa"/>
    <path d="M 18 124 H 108" stroke="#8fe0fa" stroke-opacity="0.14"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="1029" y="488" width="246" height="433" rx="40" fill="url(#metal)" stroke="#637a83" stroke-width="1.5"/>
    <rect x="1037" y="496" width="230" height="417" rx="33" fill="url(#phone-screen)" stroke="#0b1012" stroke-width="3"/>
    <rect x="1118" y="508" width="68" height="10" rx="5" fill="#0b1012"/>
    <circle cx="1152" cy="692" r="67" fill="#8fe0fa" fill-opacity="0.055" stroke="#4fa3a6" stroke-opacity="0.4"/>
    <use xlink:href="#share-mark" transform="translate(1120 656) scale(1.15)" color="#8fe0fa"/>
    <g fill="#8fe0fa" opacity="0.75">
      <path d="M 1130 804 Q 1132 789 1152 789 Q 1172 789 1174 804 Z"/>
      <path d="M 1135 791 L 1130 782 M 1169 791 L 1174 782" fill="none" stroke="#8fe0fa" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="1143" cy="798" r="1.6" fill="#172b32"/><circle cx="1161" cy="798" r="1.6" fill="#172b32"/>
    </g>
    <text x="1152" y="844" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="23" fill="#abb2bf">Android</text>
    <rect x="1121" y="890" width="62" height="4" rx="2" fill="#abb2bf" opacity="0.3"/>
  </g>

  <!-- Preserve the unaltered screenshot inside an editorial presentation frame. -->
  <text x="1320" y="184" font-family="Noto Sans, sans-serif" font-size="20" font-weight="600" letter-spacing="2.5" fill="#8e969a">ACTUAL OMARCHY PANEL</text>
  <rect x="1307" y="211" width="515" height="705" rx="18" fill="#151b1e" stroke="#34484f" filter="url(#shadow)"/>
  <image x="1320" y="224" width="489" height="679" xlink:href="quickshare-panel.png" clip-path="url(#panel-clip)"/>

  <path d="M 112 966 H 1808" stroke="#34484f" stroke-width="1"/>
  <text x="112" y="1020" font-family="Noto Sans, sans-serif" font-size="29" fill="#dce5e9">Powered by Jhonny Suárez - PuroDelphi</text>
  <text x="1808" y="1020" text-anchor="end" font-family="Noto Sans, sans-serif" font-size="24" fill="#8e969a" letter-spacing="1">NATIVE SHARING. OMARCHY STYLE.</text>
</svg>
