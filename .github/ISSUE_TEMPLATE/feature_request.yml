name: Feature proposal
description: Propose a focused improvement to Android file sharing or desktop integration.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Read docs/USER_GUIDE.md and docs/ARCHITECTURE.md before proposing changes.
        Do not include secrets, device identifiers, private files or vulnerability details; use SECURITY.md for security reports.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain the actual need and who benefits, rather than only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance
      description: Describe observable outcomes, affected components and how native Android compatibility, consent and existing functionality are preserved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and existing requirements
      description: Link related issues and explain alternative approaches. Preserve native Android Quick Share, consent and file integrity.
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Public protocol references or redacted observations, clearly separating inference from verified behavior. Do not ask for repeated approved physical tests.
