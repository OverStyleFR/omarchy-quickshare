name: Bug report
description: Report an observable problem with the daemon, UI, integration or lifecycle.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Check README.md and docs/USER_GUIDE.md for usage and troubleshooting first.
        For vulnerabilities, follow SECURITY.md instead. Do not post PINs, keys, passwords, SSIDs, device addresses, private paths/files or location metadata.
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Include the installation route (source or local Arch package).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Omarchy/Quickshell/BlueZ/kernel versions and adapter family when relevant. Android model/version is optional diagnostic data; no serial numbers or device addresses.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Native Android transfer or discovery
        - Omarchy panel or notifications
        - Nautilus menu
        - Installation, update or removal
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction and observed behavior
      description: Use synthetic files. Include expected behavior and exact errors, and distinguish observer failures from daemon failures.
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: Transfer conditions and evidence (if applicable)
      description: Direction, shared-LAN state, both devices' radio state, confirmed transport, file sizes/state and integrity method. State what was not observed; capability flags are not transport proof.
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Relevant excerpts from status, doctor or the user-service journal only after removing identifying data and secrets. Avoid unredacted full logs/screenshots.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and evidence
      options:
        - label: I removed secrets and personal/device/network identifiers, and reported only observations actually made.
          required: true
